server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/microservices
    username: root
    password: root


  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: USER-SERVICE

# this enable to read the properties from configuration server
  config:
    import: configserver:http://localhost:8085

#  profiles:
#    active: prod

# eureka client configuration

#  eureka:
#    instance:
#      prefer-ip-address: true
#
#    client:
#      fetch-registry: true
#      register-with-eureka: true
#      service-url:
#        defaultZone: http://localhost:8761/eureka


# Actuator configuration

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

#Resilience 4j configuration
resilience4j:
  circuitbreaker:
    instances:
      ratingHotelBreaker:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThresshold: 50 #percent
        minimumNumberOfCalls: 5  #default 100
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 6s #default 60000ms
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10  #default 100
        slidingWindowType: COUNT_BASED

